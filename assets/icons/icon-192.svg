<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <circle cx="120" cy="65" r="28" fill="#F8FAFC" opacity="0.9" filter="url(#glow)"/>
  <circle cx="130" cy="58" r="24" fill="#131525" />
  <!-- Waveform paths -->
  <path d="M 24 125 C 44 105, 54 145, 74 125 C 94 105, 104 145, 124 125 C 144 105, 154 135, 168 125" 
        fill="none" stroke="url(#wave)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 34 138 C 54 126, 66 150, 86 138 C 106 126, 118 150, 138 138 C 148 132, 158 142, 164 138" 
        fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>